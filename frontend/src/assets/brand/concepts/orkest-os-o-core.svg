<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Orkest OS O Core logo concept</title>
  <desc id="desc">Minimal premium O symbol with a central core for Orkest OS.</desc>
  <defs>
    <linearGradient id="coreRing" x1="126" y1="118" x2="386" y2="394" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCFDFF"/>
      <stop offset="0.55" stop-color="#AFA0FF"/>
      <stop offset="1" stop-color="#3B9EFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 256) rotate(90) scale(170)">
      <stop stop-color="#7850FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#06060A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#06060A"/>
  <circle cx="256" cy="256" r="178" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="132" stroke="url(#coreRing)" stroke-width="34"/>
  <circle cx="256" cy="256" r="36" fill="#FCFDFF"/>
  <circle cx="256" cy="256" r="54" stroke="#7850FF" stroke-opacity="0.32" stroke-width="2"/>
</svg>
