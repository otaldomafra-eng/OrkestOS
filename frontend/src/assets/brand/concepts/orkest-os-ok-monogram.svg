  <path d="M225 178V334" stroke="#FCFDFF" stroke-width="26" stroke-linecap="round"/>
  <path d="M317 185L247 255L323 332" stroke="url(#kStroke)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
